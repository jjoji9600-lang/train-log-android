name: Publish TrainLog v1.8.0 Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1.8.0.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified v1.8.0 build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh run download 42483173730 \
            --repo "${{ github.repository }}" \
            --name TrainLog-debug-apk \
            --dir dist
          test -s dist/app-debug.apk
          mv dist/app-debug.apk dist/TrainLog-v1.8.0.apk
          sha256sum dist/TrainLog-v1.8.0.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.8.0 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release v1.8.0 exists; attaching verified APK."
            gh release upload v1.8.0 dist/TrainLog-v1.8.0.apk \
              --repo "${{ github.repository }}" --clobber
          else
            gh release create v1.8.0 dist/TrainLog-v1.8.0.apk \
              --repo "${{ github.repository }}" \
              --target bbe2b84bc2f7a0cf41483e07b6346b09dd893c87 \
              --title "TrainLog 1.8.0 · 瑜伽解剖图文版" \
              --notes "### 新增内容
          - 《解剖.docx》18个体式的图文参考及双图查看
          - 4套解剖练习序列及动作完成记录
          - 保留《瑜伽之光》序列、力量训练和历史记录

          ### 安装与签名
          本版本 APK 使用 Android Debug 自签名证书，并非固定的正式发布证书。
          不同构建可能使用不同密钥。无法覆盖旧版时，切勿直接卸载有数据的 App；
          请先导出 CSV。当前版本暂不支持 CSV 导入。正式连续升级需要后续配置
          受保护的固定签名密钥。"
          fi
